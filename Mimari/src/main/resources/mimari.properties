# Valores por defecto de MIMARI (este archivo SÍ se puede subir a git: no lleva claves).
# Para poner TUS valores, crea el archivo  mimari.local.properties  junto al pom.xml (ver mimari.local.properties.ejemplo)
# o usa variables de entorno. Orden de prioridad: variable de entorno > mimari.local.properties > este archivo.

# ---- IA (Gemini). Variable de entorno equivalente: GEMINI_API_KEY
gemini.api.key=
# Modelo con visión (acepta imagen + texto). Variable de entorno: GEMINI_MODELO
gemini.modelo=gemini-2.5-flash
gemini.timeout.segundos=60

# ---- Dónde se guardan las fotos y los PDF subidos. Vacío = TOMCAT_BASE/mimari-uploads (o ./target/tomcat/mimari-uploads con Main)
almacenamiento.carpeta=
